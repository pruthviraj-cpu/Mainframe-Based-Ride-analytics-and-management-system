services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mainframe-ride-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount DataPreprocessing directory so uploaded files and generated .ps datasets persist on host
      - ./DataPreprocessing:/app/DataPreprocessing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - mainframe-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mainframe-ride-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mainframe-net

networks:
  mainframe-net:
    driver: bridge
